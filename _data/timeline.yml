      sources:
      - title: Legacy Features
        url: https://docs.midjourney.com/hc/en-us/articles/33329788681101-Legacy-Features
        publisher: Midjourney
        date: '2025-01-09'
    - text: <b>DALL-E 2</b> is announced for gradual release.
      special: true
      sources:
      - title: DALL·E 2
        url: https://openai.com/index/dall-e-2/
        publisher: OpenAI
