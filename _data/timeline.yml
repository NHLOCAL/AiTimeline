      sources:
      - title: Legacy Features
        url: https://docs.midjourney.com/hc/en-us/articles/33329788681101-Legacy-Features
        publisher: Midjourney
        date: '2025-01-09'
  - date: August
    info:
    - text: <b>Stable Diffusion 1.4</b> is released.
      sources:
      - title: Stable Diffusion Public Release
        url: https://stability.ai/news-updates/stable-diffusion-public-release
        publisher: Stability AI
        date: '2022-08-22'
  - date: October
    info:
    - text: <b>Stable Diffusion 1.5</b> becomes available.
      special: true
      sources:
      - title: Stable Diffusion v1-5 Model Card
        url: https://huggingface.co/stable-diffusion-v1-5/stable-diffusion-v1-5
        publisher: Runway / Hugging Face (model card mirror)
        date: '2022-10-20'
  - date: November
    info:
    - text: <b>ChatGPT</b>, a chatbot by OpenAI using GPT-3.5, is released to the public and quickly becomes a viral sensation.
      special: true
      sources:
      - title: Introducing ChatGPT
        url: https://openai.com/index/chatgpt/
        publisher: OpenAI
        date: '2022-11-30'
    - text: <b>Midjourney v4</b> is released.
      sources:
      - title: Legacy Features
        url: https://docs.midjourney.com/hc/en-us/articles/33329788681101-Legacy-Features
        publisher: Midjourney
        date: '2025-01-09'
    - text: <b>Stable Diffusion 2.0</b> is launched.
      sources:
      - title: Stable Diffusion 2.0 Release
        url: https://stability.ai/news-updates/stable-diffusion-v2-release
        publisher: Stability AI
        date: '2022-11-24'
  - date: December
    info:
    - text: <b>Stable Diffusion 2.1</b> is released.
      sources:
      - title: Stable Diffusion v2.1 and DreamStudio Updates 7-Dec 22
        url: https://stability.ai/news-updates/stablediffusion2-1-release7-dec-2022
        publisher: Stability AI
        date: '2022-12-07'
- year: 2023
  events:
  - date: February
    info:
    - text: Meta releases the <b>LLaMA</b> language model to approved researchers under a noncommercial research license.
      special: true
      sources:
      - title: 'Introducing LLaMA: A foundational, 65-billion-parameter large language model'
        url: https://ai.meta.com/blog/large-language-model-llama-meta-ai/
        publisher: Meta
        date: '2023-02-24'
    - text: Microsoft gradually releases <b>Bing AI</b>, an AI chat based on an upgraded GPT model integrating internet search.
      sources:
      - title: Reinventing search with a new AI-powered Microsoft Bing and Edge, your copilot for the web
        url: https://blogs.microsoft.com/blog/2023/02/07/reinventing-search-with-a-new-ai-powered-microsoft-bing-and-edge-your-copilot-for-the-web/
        publisher: Microsoft
        date: '2023-02-07'
  - date: March
    info:
    - text: <b>Midjourney v5</b> is launched.
      sources:
      - title: Legacy Features
        url: https://docs.midjourney.com/hc/en-us/articles/33329788681101-Legacy-Features
        publisher: Midjourney
        date: '2025-01-09'
    - text: OpenAI's <b>GPT-4</b> model is partially released, featuring multimodal image analysis and improved multi-language support.
      special: true
      sources:
      - title: GPT-4
        url: https://openai.com/index/gpt-4/
        publisher: OpenAI
        date: '2023-03-14'
    - text: Google releases the AI chat <b>Bard</b> in a limited capacity, based on the LaMDA language model.
      sources:
      - title: Try Bard and share your feedback
        url: https://blog.google/innovation-and-ai/products/try-bard/
        publisher: Google
        date: '2023-03-21'
    - text: Adobe releases the <b>Firefly</b> image creation model as a beta version to a waiting list. The model allowed a variety of capabilities including text formatting.
      sources:
      - title: Adobe Unveils Firefly, a Family of new Creative Generative AI
        url: https://news.adobe.com/news/news-details/2023/adobe-unveils-firefly-a-family-of-new-creative-generative-ai
        publisher: Adobe
        date: '2023-03-21'
  - date: May
    info:
    - text: <b>Midjourney v5.1</b> is released.
      sources:
      - title: Legacy Features
        url: https://docs.midjourney.com/hc/en-us/articles/33329788681101-Legacy-Features
        publisher: Midjourney
        date: '2025-01-09'
    - text: Google announces an upgrade to Bard, moving it to the upgraded <b>PaLM 2</b> language model. It will support 180 countries and many languages.
      sources:
      - title: 'What’s ahead for Bard: More global, more visual, more integrated'
        url: https://blog.google/intl/en-in/google-bard-updates-io-2023/
        publisher: Google
        date: '2023-05-10'
  - date: June
    info:
    - text: <b>Midjourney v5.2</b> is launched.
      sources:
      - title: Legacy Features
        url: https://docs.midjourney.com/hc/en-us/articles/33329788681101-Legacy-Features
        publisher: Midjourney
        date: '2025-01-09'
  - date: July
    info:
    - text: <b>Stable Diffusion XL 1.0</b> is released.
      sources:
      - title: Announcing SDXL 1.0
        url: https://stability.ai/news-updates/stable-diffusion-sdxl-1-announcement
        publisher: Stability AI
        date: '2023-07-26'
    - text: Anthropic announces a new version of their large language model - <b>Claude 2</b>.
      sources:
      - title: Claude 2
        url: https://www.anthropic.com/news/claude-2
        publisher: Anthropic
        date: '2023-07-11'
    - text: Meta releases the <b>LLaMA 2</b> open source language model to the general public in a variety of sizes.
      sources:
      - title: Meta and Microsoft Introduce the Next Generation of Llama
        url: https://about.fb.com/news/2023/07/llama-2/
        publisher: Meta
        date: '2023-07-18'
  - date: October
    info:
    - text: <b>DALL-E 3</b> is released.
      sources:
      - title: DALL·E 3 is now available in ChatGPT Plus and Enterprise
        url: https://openai.com/index/dall-e-3-is-now-available-in-chatgpt-plus-and-enterprise/
        publisher: OpenAI
        date: '2023-10-19'
    - text: Adobe releases <b>Firefly 2</b>.
      sources:
      - title: 'Adobe MAX 2023: Introducing the next generation of creativity, powered by AI'
        url: https://blog.adobe.com/en/publish/2023/10/10/next-gen-of-creativity-powered-by-ai
        publisher: Adobe
        date: '2023-10-10'
  - date: November
    info:
    - text: <b>Stable Diffusion XL Turbo</b> is released - A fast model that allows the creation of an image in one step in real-time.
      sources:
      - title: 'Introducing SDXL Turbo: A Real-Time Text-to-Image Generation Model'
        url: https://stability.ai/news-updates/stability-ai-sdxl-turbo
        publisher: Stability AI
        date: '2023-11-28'
  - date: December
    info:
    - text: <b>Midjourney v6</b> is launched.
      sources:
      - title: Version
        url: https://docs.midjourney.com/hc/en-us/articles/32199405667853-Version
        publisher: Midjourney
        date: '2024-11-26'
    - text: Google upgrades Bard in limited areas, moving it to be based on the upgraded <b>Gemini Pro</b> language model.
      sources:
      - title: Bard gets its biggest upgrade yet with Gemini
        url: https://blog.google/products-and-platforms/products/gemini/google-bard-try-gemini-ai/
        publisher: Google
        date: '2023-12-06'
    - text: xAI begins rolling out the <b>Grok AI</b> chatbot to X Premium+ subscribers.
      sources:
      - title: Musk says his AI firm xAI is rolling out chatbot Grok to X Premium+ subscribers
        url: https://kfgo.com/2023/12/07/musk-says-his-ai-firm-xai-is-rolling-out-chatbot-grok-to-x-premium-subscribers/
        publisher: Reuters / KFGO
        date: '2023-12-07'
- year: 2024
  events:
  - date: February
    info:
    - text: Stability AI announces <b>Stable Diffusion 3</b> (gradually released to waiting list).
      sources:
      - title: Stable Diffusion 3
        url: https://stability.ai/news-updates/stable-diffusion-3
        publisher: Stability AI
        date: '2024-02-22'
    - text: Google upgrades the artificial intelligence chat in Bard, basing it on the new <b>Gemini Pro</b> model, in all available languages. Google replaces "Bard" with "Gemini".
      sources:
      - title: 'Bard’s latest updates: Access Gemini Pro globally and generate images'
        url: https://blog.google/products-and-platforms/products/gemini/google-bard-gemini-pro-image-generation/
        publisher: Google
        date: '2024-02-01'
      - title: 'Bard becomes Gemini: Try Ultra 1.0 and a new mobile app today'
        url: https://blog.google/products-and-platforms/products/gemini/bard-gemini-advanced-app/
        publisher: Google
        date: '2024-02-08'
    - text: Google announces the <b>Gemini Pro 1.5</b> multimodal language model capable of parsing up to a million tokens, as well as parsing video and images. The model is gradually released to developers on a waiting list.
      special: true
      sources:
      - title: 'Our next-generation model: Gemini 1.5'
        url: https://blog.google/innovation-and-ai/products/google-gemini-next-generation-model-february-2024/
        publisher: Google DeepMind
        date: '2024-02-15'
    - text: OpenAI announces the <b>Sora</b> model that produces videos up to a minute long. The model is not released to the public at this time.
      special: true
      sources:
      - title: Video generation models as world simulators
        url: https://openai.com/index/video-generation-models-as-world-simulators/
        publisher: OpenAI
        date: '2024-02-15'
  - date: March
    info:
    - text: xAI announces <b>Grok 1.5</b>, with improved reasoning and a 128K context window, for early testers and existing Grok users.
      sources:
      - title: Announcing Grok-1.5
        url: https://x.ai/news/grok-1.5
        publisher: xAI
        date: '2024-03-28'
    - text: Anthropic announces <b>Claude 3</b>, a new version of their large language model. The version is deployed in 3 different sizes, with the largest model performing better than GPT-4.
      sources:
      - title: Introducing the next generation of Claude
        url: https://www.anthropic.com/news/claude-3-family
        publisher: Anthropic
        date: '2024-03-04'
    - text: Suno AI, which develops a model for creating music, releases <b>Suno v3</b> to the general public.
      sources:
      - title: Introducing v3
        url: https://about.suno.com/blog/v3
        publisher: Suno
        date: '2024-03-21'
  - date: April
    info:
    - text: Stability AI releases a new update to the music creation model - <b>Stable Audio 2.0</b>.
      sources:
      - title: Introducing Stable Audio 2.0
        url: https://stability.ai/news/stable-audio-2-0
        publisher: Stability AI
        date: '2024-04-03'
    - text: xAI previews <b>Grok-1.5V</b>, its first model with image understanding. The company reports leading results on its RealWorldQA benchmark and plans access for early testers.
      sources:
      - title: Grok-1.5 Vision Preview
        url: https://x.ai/news/grok-1.5v
        publisher: xAI
        date: '2024-04-12'
    - text: The Mistral company releases its new model <b>Mixtral 8x22B</b> as open source. This is the most powerful model among the open source models and it contains 141 billion parameters but uses a method that allows more economical use.
      sources:
      - title: Cheaper, Better, Faster, Stronger
        url: https://mistral.ai/news/mixtral-8x22b/
        publisher: Mistral AI
        date: '2024-04-17'
    - text: Meta releases the <b>LLaMA 3</b> model as open source in sizes 8B and 70B parameters. The large model shows better performance than Claude 3 Sonnet and Gemini Pro 1.5 in several measures. Meta is expected to later release larger models with 400 billion parameters and more.
      sources:
      - title: 'Introducing Meta Llama 3: The most capable openly available LLM to date'
        url: https://ai.meta.com/blog/meta-llama-3/
        publisher: Meta
        date: '2024-04-18'
    - text: Microsoft releases the <b>Phi-3-mini</b> model in open source. The model comes in a reduced version of 3.8B parameters, which allows it to run on mobile devices as well, and it presents capabilities similar to GPT-3.5.
      special: true
      sources:
      - title: 'Introducing Phi-3: Redefining what’s possible with SLMs'
        url: https://azure.microsoft.com/en-us/blog/introducing-phi-3-redefining-whats-possible-with-slms/
        publisher: Microsoft
        date: '2024-04-23'
    - text: Adobe announces its new image creation model <b>Firefly 3</b>.
      sources:
      - title: Adobe Introduces Firefly Image 3 Foundation Model to Take Creative Exploration and Ideation to New Heights
        url: https://news.adobe.com/news/news-details/2024/adobe-introduces-firefly-image-3-foundation-model-to-take-creative-exploration-and-ideation-to-new-heights
        publisher: Adobe
        date: '2024-04-23'
    - text: <b>Reka AI</b> introduces <b>Reka Core</b>, joining its smaller Flash and Edge models. Core processes video, audio, and images, with benchmark results the company reports as competitive with GPT-4V.
      sources:
      - title: 'Reka Core: Our Frontier Class Multimodal Language Model'
        url: https://reka.ai/labs/research/reka-core-our-frontier-class-multimodal-language-model
        publisher: Reka AI
        date: '2024-04-15'
    - text: Apple releases <b>OpenELM</b>, a family of language models with weights, training code, and inference tools. The models range from 270 million to 3 billion parameters.
      sources:
      - title: 'OpenELM: An Efficient Language Model Family with Open Training and Inference Framework'
        url: https://arxiv.org/abs/2404.14619
        publisher: Apple / arXiv
        date: '2024-04-22'
  - date: May
    info:
    - text: OpenAI announces the <b>GPT-4o model</b> that presents full multimodal capabilities, including receiving and creating text, images, and audio. The model presents an impressive ability to speak with a high response speed and in natural language. The model is 2 times more efficient than the GPT-4 Turbo model, and has better capabilities for languages other than English.
      special: true
      sources:
      - title: Hello GPT-4o
        url: https://openai.com/index/hello-gpt-4o/
        publisher: OpenAI
        date: '2024-05-13'
    - text: Google announces <b>Gemini 1.5 Flash</b> and a 2-million-token preview for Gemini 1.5 Pro. It also introduces <b>Imagen 3</b>, the <b>Music AI Sandbox</b>, the video model <b>Veo</b>, and <b>Project Astra</b>, a prototype assistant that understands live audio and video.
      sources:
      - title: Gemini breaks new ground with a faster model, longer context, AI agents and more
        url: https://blog.google/innovation-and-ai/products/google-gemini-update-flash-ai-assistant-io-2024/
        publisher: Google DeepMind
        date: '2024-05-14'
      - title: New generative media models and tools, built with and for creators
        url: https://blog.google/innovation-and-ai/products/google-generative-ai-veo-imagen-3/
        publisher: Google DeepMind
        date: '2024-05-14'
    - text: 'Microsoft announces <b>Copilot+</b> for dedicated computers, which will allow a full search of the user''s history through screenshots of the user''s activity. The company also released as open source the SLMs that display impressive capabilities in a minimal size: <b>Phi-3 Small</b>, <b>Phi-3 Medium</b>, and <b>Phi-3 Vision</b> which includes image recognition capability.'
      sources:
      - title: Introducing Copilot+ PCs
        url: https://blogs.microsoft.com/blog/2024/05/20/introducing-copilot-pcs/
        publisher: Microsoft
        date: '2024-05-20'
      - title: New models added to the Phi-3 family, available on Microsoft Azure
        url: https://azure.microsoft.com/en-us/blog/new-models-added-to-the-phi-3-family-available-on-microsoft-azure/
        publisher: Microsoft
        date: '2024-05-21'
    - text: Meta introduces <b>Chameleon</b>, a new multimodal model that seamlessly renders text and images.
      sources:
      - title: 'Chameleon: Mixed-Modal Early-Fusion Foundation Models'
        url: https://arxiv.org/abs/2405.09818
        publisher: Meta / arXiv
        date: '2024-05-16'
    - text: Mistral AI releases a new open source version of its language model <b>Mistral-7B-Instruct-v0.3</b>.
      sources:
      - title: Model Card for Mistral-7B-Instruct-v0.3
        url: https://huggingface.co/mistralai/Mistral-7B-Instruct-v0.3
        publisher: Mistral AI / Hugging Face
        date: '2024-05-22'
    - text: Google announces <b>AI Overviews</b> intended to give a summary of the relevant information in Google search.
      special: true
      sources:
      - title: 'Generative AI in Search: Let Google do the searching for you'
        url: https://blog.google/products-and-platforms/products/search/generative-ai-google-search-may-2024/
        publisher: Google
        date: '2024-05-14'
    - text: Suno AI releases an updated music creation model <b>Suno v3.5</b>.
      sources:
      - title: v3.5 is Available to Everyone
        url: https://about.suno.com/release-notes/v3-5-is-available-to-everyone
        publisher: Suno
        date: '2024-05-30'
    - text: Mistral AI releases a new language model designed for coding <b>Codestral</b> in size 22B.
      sources:
      - title: Codestral
        url: https://mistral.ai/news/codestral/
        publisher: Mistral AI
        date: '2024-05-29'
  - date: June
    info:
    - text: Stability AI releases its updated image creation model <b>Stable Diffusion 3</b> in a medium version in size 2B parameters.
      sources:
      - title: Announcing the Open Release of Stable Diffusion 3 Medium, Our Most Sophisticated Image Generation Model to Date
        url: https://stability.ai/news-updates/stable-diffusion-3-medium
        publisher: Stability AI
        date: '2024-06-12'
    - text: Apple announces <b>Apple Intelligence</b>, an AI system that will be integrated into the company's devices and will combine AI models of different sizes for different tasks.
      sources:
      - title: Introducing Apple’s On-Device and Server Foundation Models
        url: https://machinelearning.apple.com/research/introducing-apple-foundation-models
        publisher: Apple
        date: '2024-06-10'
    - text: DeepSeekAI publishes the <b>DeepSeekCoderV2</b> open source language model which presents similar coding capabilities to models such as GPT-4, Claude 3 Opus and more.
      sources:
      - title: 'DeepSeek-Coder-V2: Breaking the Barrier of Closed-Source Models in Code Intelligence'
        url: https://arxiv.org/abs/2406.11931
        publisher: DeepSeek-AI / arXiv
        date: '2024-06-17'
    - text: <b>Runway</b> introduces <b>Gen3 Alpha</b>, a new AI model for video generation.
      sources:
      - title: 'Runway Gen-3 Alpha: AI Video Generation with Temporal Control'
        url: https://runway.com/research/introducing-gen-3-alpha
        publisher: Runway
        date: '2024-06-17'
    - text: Anthropic releases the <b>Claude Sonnet 3.5</b> model, which presents better capabilities than other models with low resource usage.
      special: true
      sources:
      - title: Claude 3.5 Sonnet
        url: https://www.anthropic.com/news/claude-3-5-sonnet
        publisher: Anthropic
        date: '2024-06-21'
    - text: Microsoft releases in open source a series of image recognition models called <b>Florence 2</b>.
      sources:
      - title: Florence-2
        url: https://huggingface.co/microsoft/Florence-2-large
        publisher: Microsoft / Hugging Face
        date: '2024-06-15'
    - text: Google announces <b>Gemma 2</b> open source language models with 9B and 27B parameter sizes. Also, the company opens the context window capabilities to developers for up to 2 million tokens.
      sources:
      - title: Gemini 1.5 Pro 2M context window, code execution capabilities, and Gemma 2 are available today
        url: https://developers.googleblog.com/en/new-features-for-the-gemini-api-and-google-ai-studio/
        publisher: Google
        date: '2024-06-27'
  - date: July
    info:
    - text: OpenAI has released a miniaturized model called <b>GPT-4o mini</b> that presents high capabilities at a low cost
      sources:
      - title: 'GPT-4o mini: advancing cost-efficient intelligence'
        url: https://openai.com/index/gpt-4o-mini-advancing-cost-efficient-intelligence/
        publisher: OpenAI
        date: '2024-07-18'
    - text: Meta releases as open source the <b>llama 3.1 model</b> in sizes 8B, 70B and 405B. The large model features the same capabilities as the best closed source models
      special: true
      sources:
      - title: 'Introducing Llama 3.1: Our most capable models to date'
        url: https://ai.meta.com/blog/meta-llama-3-1/
        publisher: Meta
        date: '2024-07-23'
    - text: 'mistral ai releases three new models: <b>Codestral Mamba</b>, <b>Mistral NeMo</b> and <b>Mathstral</b> designed for mathematics'
      sources:
      - title: Codestral Mamba
        url: https://mistral.ai/news/codestral-mamba/
        publisher: Mistral AI
        date: '2024-07-16'
      - title: MathΣtral
        url: https://mistral.ai/news/mathstral/
        publisher: Mistral AI
        date: '2024-07-16'
      - title: Mistral NeMo
        url: https://mistral.ai/news/mistral-nemo/
        publisher: Mistral AI
        date: '2024-07-18'
    - text: Google DeepMind unveils <b>AlphaProof</b> and <b>AlphaGeometry 2</b>, which together solve four of six IMO 2024 problems at silver-medal level in a research evaluation.
      special: true
      sources:
      - title: AI achieves silver-medal standard solving International Mathematical Olympiad problems
        url: https://deepmind.google/blog/ai-solves-imo-problems-at-silver-medal-level/
        publisher: Google DeepMind
        date: '2024-07-25'
    - text: OpenAI launches <b>SearchGPT</b>, a web-search prototype for a limited group of users and publishers.
      sources:
      - title: SearchGPT Prototype
        url: https://openai.com/index/searchgpt-prototype/
        publisher: OpenAI
        date: '2024-07-25'
    - text: Startup Udio has released <b>Udio v1.5</b>, an updated version of its music creation model
      sources:
      - title: Introducing v1.5
        url: https://www.udio.com/blog/introducing-v1-5
        publisher: Udio
        date: '2024-07-23'
    - text: Mistral AI has released a large language model <b>Mistral Large 2</b> in size 123B, which presents capabilities close to the closed SOTA models.
      special: true
      sources:
      - title: Large Enough
        url: https://mistral.ai/news/mistral-large-2407/
        publisher: Mistral AI
        date: '2024-07-24'
    - text: <b>Midjourney v6.1</b> is released
      sources:
      - title: Version 6.1
        url: https://updates.midjourney.com/version-6-1/
        publisher: Midjourney
        date: '2024-07-30'
    - text: Google releases the <b>Gemma 2 2B</b> model as open source. The model demonstrates better capabilities than much larger models.
      sources:
      - title: 'Smaller, Safer, More Transparent: Advancing Responsible AI with Gemma'
